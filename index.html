<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Badge3D — Turn Shields.io badges into 3D models</title>
		<script>
			try {
				const theme = localStorage.getItem('badge3d-color-theme');
				const isDark =
					theme === 'dark' ||
					(theme !== 'light' &&
						matchMedia('(prefers-color-scheme: dark)').matches);
				if (theme === 'light' || theme === 'dark')
					document.documentElement.dataset.theme = theme;
				document.querySelector('meta[name="theme-color"]').content = isDark
					? '#171816'
					: '#f2eee5';
			} catch {}
		</script>
		<meta content="light dark" name="color-scheme" />
		<!-- eslint-disable-next-line @html-eslint/use-baseline -- Progressive enhancement: unsupported browsers safely ignore theme-color. -->
		<meta content="#f2eee5" name="theme-color" />
		<meta
			content="Paste a Shields.io badge URL, preview the raised model, and export a print-ready STL."
			name="description"
		/>
		<link href="https://3d.shields.io/" rel="canonical" />
		<meta content="website" property="og:type" />
		<meta content="Badge3D" property="og:site_name" />
		<meta
			content="Badge3D — Turn Shields.io badges into 3D models"
			property="og:title"
		/>
		<meta
			content="Paste a Shields.io badge URL, preview the raised model, and export a print-ready STL."
			property="og:description"
		/>
		<meta content="https://3d.shields.io/" property="og:url" />
		<meta content="https://3d.shields.io/opengraph.png" property="og:image" />
		<meta content="image/png" property="og:image:type" />
		<meta content="1200" property="og:image:width" />
		<meta content="630" property="og:image:height" />
		<meta
			content="Badge3D turning a Shields.io build-passing badge into a print-ready 3D model"
			property="og:image:alt"
		/>
		<meta content="summary_large_image" name="twitter:card" />
		<meta
			content="Badge3D — Turn Shields.io badges into 3D models"
			name="twitter:title"
		/>
		<meta
			content="Paste a Shields.io badge URL, preview the raised model, and export a print-ready STL."
			name="twitter:description"
		/>
		<meta content="https://3d.shields.io/opengraph.png" name="twitter:image" />
		<meta
			content="Badge3D turning a Shields.io build-passing badge into a print-ready 3D model"
			name="twitter:image:alt"
		/>
		<link type="image/webp" href="/badge3d.webp" rel="icon" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
